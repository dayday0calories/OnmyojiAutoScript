<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS</title>
    <script type="module" src="./main.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3ea;
        --fg: #1f1a14;
        --muted: #6b6259;
        --accent: #a1461f;
        --panel: #fffaf1;
        --border: #e9dcc8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, #f2d9b7 0, transparent 30%),
          radial-gradient(circle at bottom right, #ead7c4 0, transparent 32%),
          var(--bg);
        color: var(--fg);
        font-family: "SF Pro Text", "Helvetica Neue", sans-serif;
      }

      .card {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: color-mix(in srgb, var(--panel) 90%, white);
        box-shadow: 0 18px 50px rgba(76, 54, 33, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(161, 70, 31, 0.08);
        color: var(--accent);
        font-size: 14px;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
      }

      button,
      a {
        appearance: none;
        border: 0;
        text-decoration: none;
        cursor: pointer;
        padding: 12px 16px;
        border-radius: 12px;
        font: inherit;
      }

      button {
        background: var(--accent);
        color: white;
      }

      a {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>OAS WebUI</h1>
      <p>内置服务正在启动。等待本地服务就绪后，此窗口会自动切换到内置 WebUI。</p>
      <div class="status" id="status">正在启动本地服务 127.0.0.1:22267…</div>
      <div class="actions">
        <button id="retry">重试</button>
        <a id="openExternal" href="http://127.0.0.1:22267/webui/" target="_blank" rel="noreferrer">在浏览器中打开</a>
      </div>
    </main>
  </body>
</html>
