<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS Web UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              card: "0 8px 24px rgba(15, 23, 42, 0.06)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-screen overflow-hidden bg-gray-100 text-gray-800">
    <main class="mx-auto h-screen max-w-[1700px] p-3">
      <div
        class="grid h-full grid-cols-1 gap-3 lg:grid-cols-[120px_250px_300px_minmax(0,1fr)]"
      >
        <aside
          class="flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-card"
        >
          <div id="configs-title" class="mb-2 text-sm font-semibold">
            Configs
          </div>
          <div
            id="config-list"
            class="min-h-0 flex-1 space-y-2 overflow-auto"
          ></div>
          <div class="mt-auto pt-3">
            <button
              id="lang-btn"
              class="w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50"
            >
              中文
            </button>
          </div>
        </aside>

        <aside
          class="flex h-full flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-card"
        >
          <div id="tasks-title" class="mb-2 text-sm font-semibold">Tasks</div>
          <div id="tasks-hint" class="mb-2 text-xs text-gray-500">
            Click one task to edit config
          </div>
          <div
            id="task-list"
            class="min-h-0 flex-1 space-y-2 overflow-auto pr-1"
          ></div>
        </aside>

        <aside
          class="flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white p-3 shadow-card"
        >
          <div class="mb-2 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span
                id="scheduler-indicator"
                class="inline-block h-2.5 w-2.5 rounded-full bg-gray-400"
              ></span>
              <div id="scheduler-title" class="text-sm font-semibold">
                Scheduler
              </div>
            </div>
            <button
              id="refresh-btn"
              class="rounded-lg border border-gray-300 bg-white px-2.5 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50"
            >
              Refresh
            </button>
          </div>
          <div class="mb-2 text-xs text-gray-500">
            <span id="current-label">Current:</span>
            <span id="current-config" class="font-semibold text-gray-700"
              >-</span
            >
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button
              id="start-btn"
              class="rounded-lg bg-emerald-600 px-3 py-2 text-xs font-semibold text-white hover:bg-emerald-700"
            >
              Start
            </button>
            <button
              id="stop-btn"
              class="rounded-lg bg-rose-600 px-3 py-2 text-xs font-semibold text-white hover:bg-rose-700"
            >
              Stop
            </button>
          </div>

          <div class="mt-3 min-h-0 flex-1 space-y-3 overflow-auto pr-1">
            <div class="rounded-xl border border-gray-200 p-3">
              <div id="running-title" class="mb-2 text-sm font-semibold">
                Running
              </div>
              <div id="running-empty" class="text-xs text-gray-400">
                No running task
              </div>
              <div
                id="running-task"
                class="hidden rounded-lg border border-gray-200 bg-gray-50 p-2"
              >
                <div id="running-name" class="text-sm font-semibold"></div>
                <div id="running-time" class="mt-1 text-xs text-gray-500"></div>
              </div>
            </div>

            <div class="rounded-xl border border-gray-200 p-3">
              <div id="pending-title" class="mb-2 text-sm font-semibold">
                Pending
              </div>
              <div id="pending-empty" class="text-xs text-gray-400">
                No pending tasks
              </div>
              <div
                id="pending-list"
                class="h-24 space-y-2 overflow-auto pr-1"
              ></div>
            </div>

            <div class="rounded-xl border border-gray-200 p-3">
              <div id="waiting-title" class="mb-2 text-sm font-semibold">
                Waiting
              </div>
              <div id="waiting-empty" class="text-xs text-gray-400">
                No waiting tasks
              </div>
              <div
                id="waiting-list"
                class="max-h-72 space-y-2 overflow-auto pr-1"
              ></div>
            </div>
          </div>
        </aside>

        <section
          class="relative flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white p-3 shadow-card"
        >
          <div
            class="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-gray-200 px-3 py-2"
          >
            <div class="flex items-center gap-2">
              <div id="log-title" class="text-sm font-semibold">Log</div>
              <span
                id="run-status-text"
                class="rounded-full border border-gray-300 bg-gray-100 px-2 py-0.5 text-xs text-gray-600"
                >Idle</span
              >
            </div>
            <div class="flex items-center gap-2">
              <button
                id="autoscroll-btn"
                class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50"
              >
                Auto Scroll On
              </button>
              <button
                id="clear-log-btn"
                class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50"
              >
                Clear
              </button>
            </div>
          </div>
          <pre
            id="log-box"
            class="min-h-0 flex-1 overflow-auto rounded-xl border border-gray-200 bg-gray-50 p-3 text-xs leading-relaxed text-gray-700"
          ></pre>

          <div
            id="task-overlay"
            class="absolute inset-0 hidden flex flex-col rounded-2xl bg-white p-3"
          >
            <div
              class="mb-3 flex items-center justify-between rounded-xl border border-gray-200 px-3 py-2"
            >
              <div>
                <div id="task-config-title" class="text-sm font-semibold">
                  Task Config
                </div>
                <div id="overlay-task-title" class="text-xs text-gray-500">
                  -
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button
                  id="overlay-reload-btn"
                  class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50"
                >
                  Reload
                </button>
                <button
                  id="overlay-back-btn"
                  class="rounded-lg bg-gray-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-gray-900"
                >
                  Return
                </button>
              </div>
            </div>
            <div
              id="task-groups"
              class="min-h-0 flex-1 space-y-3 overflow-auto pr-1"
            ></div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
